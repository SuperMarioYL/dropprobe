<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="DropProbe — One-command smoke-probe for the weekly open-weight carousel.">
  <defs>
    <linearGradient id="hg" x1="-220%" y1="0%" x2="-100%" y2="0%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#0071E3"/>
      <animate attributeName="x1" values="-220%;100%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-100%;220%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#F5F5F7"/>

  <!-- brand wordmark: animated gradient sweep (infinite, seamless) -->
  <text x="440" y="142" text-anchor="middle" font-size="62" font-weight="700" fill="url(#hg)">DropProbe</text>

  <!-- tagline: one-shot fade-in + rise (decorative only, freeze) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.4s" dur="0.8s" fill="freeze"/>
    <text x="440" y="188" text-anchor="middle" font-size="17" font-weight="500" fill="#6E6E73">One-command smoke-probe for the weekly open-weight carousel.</text>
  </g>

  <!-- carousel pulse dots: three labs, staggered breathing (infinite) -->
  <g>
    <circle cx="416" cy="226" r="3" fill="#0071E3">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="2.4s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="226" r="3" fill="#5E5CE6">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="2.4s" begin="-0.8s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="464" cy="226" r="3" fill="#10A37F">
      <animate attributeName="opacity" values="0.3;1;0.3" keyTimes="0;0.5;1" dur="2.4s" begin="-1.6s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
