# candidate GGUF quants, backend fork, and day-0 tooling-readiness that the
# probe layer needs. Hand-curated per weekly drop — a community PR flow is
# out of scope for v0.1 (the first external config-DB PR is the kill-criterion
# signal the plan watches for).
