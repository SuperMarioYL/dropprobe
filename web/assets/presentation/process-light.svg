<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="465" viewBox="0 0 1000 465" data-palette="e6a556-dce76a-f6baac-2a90f9105f5c" role="img" aria-labelledby="process-light-title process-light-desc"><title id="process-light-title">DropProbe process</title><desc id="process-light-desc">Static true/null hints; smoke_probe_ok stays null.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="1000" y2="465"><stop stop-color="#956b38"/><stop offset=".6" stop-color="#727737"/><stop offset="1" stop-color="#8e6b63"/></linearGradient><radialGradient id="halo"><stop stop-color="#956b38" stop-opacity=".22"/><stop offset="1" stop-color="#fefcf9" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f7e4cb" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#956b38" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="1000" height="465" rx="16" fill="#fefcf9"/><rect width="1000" height="465" rx="16" fill="url(#grid)"/><ellipse cx="630.0" cy="199.95" rx="500.0" ry="325.5" fill="url(#halo)"/><text x="44" y="44" fill="#726e6b" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="44" y="84.0" fill="#27211c" font-size="30" text-anchor="start" font-weight="400">Two declared memory profiles</text><path d="M254.0 237H278.0" fill="none" stroke="#956b38" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M254.0 237H278.0" class="flow" fill="none" stroke="#8e6b63" stroke-width="2"/><rect x="44.0" y="176" width="210.0" height="122" rx="12" fill="#fefbf7" stroke="#f7e4cb"/><text x="62.0" y="207.0" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">01  Declare</text><text x="62.0" y="236.4" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">candidates</text><text x="62.0" y="259.0" fill="#726e6b" font-size="17" text-anchor="start" font-weight="400">Q4 4 GiB; Q8 8</text><text x="62.0" y="282.8" fill="#726e6b" font-size="17" text-anchor="start" font-weight="400">GiB</text><path d="M488.0 237H512.0" fill="none" stroke="#956b38" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M488.0 237H512.0" class="flow" fill="none" stroke="#8e6b63" stroke-width="2"/><rect x="278.0" y="176" width="210.0" height="122" rx="12" fill="#fefbf7" stroke="#f7e4cb"/><text x="296.0" y="207.0" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">02  Declare</text><text x="296.0" y="236.4" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">RAM</text><text x="296.0" y="259.0" fill="#726e6b" font-size="17" text-anchor="start" font-weight="400">8 GiB and 2 GiB</text><text x="296.0" y="282.8" fill="#726e6b" font-size="17" text-anchor="start" font-weight="400">CPU cases</text><path d="M722.0 237H746.0" fill="none" stroke="#956b38" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M722.0 237H746.0" class="flow" fill="none" stroke="#8e6b63" stroke-width="2"/><rect x="512.0" y="176" width="210.0" height="122" rx="12" fill="#fefbf7" stroke="#f7e4cb"/><text x="530.0" y="207.0" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">03  Select</text><text x="530.0" y="236.4" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">smallest</text><text x="530.0" y="259.0" fill="#726e6b" font-size="17" text-anchor="start" font-weight="400">Q4 in both cases</text><rect x="746.0" y="176" width="210.0" height="122" rx="12" fill="#fefbf7" stroke="#f7e4cb"/><text x="764.0" y="207.0" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">04  Keep probe</text><text x="764.0" y="236.4" fill="#27211c" font-size="21" text-anchor="start" font-weight="400">unknown</text><text x="764.0" y="259.0" fill="#726e6b" font-size="17" text-anchor="start" font-weight="400">No inference was</text><text x="764.0" y="282.8" fill="#726e6b" font-size="17" text-anchor="start" font-weight="400">run</text><text x="44" y="379.0" fill="#8e6b63" font-size="20" text-anchor="start" font-weight="400">Static true/null hints; smoke_probe_ok stays null.</text></svg>
