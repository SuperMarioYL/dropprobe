[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dropprobe"
version = "0.1.0"
description = "List recent model-repository updates, inspect local hardware and assemble static candidate configurations; live inference probing is not implemented."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "llm",
    "llama-cpp",
    "ollama",
    "gguf",
    "smoke-test",
    "open-weights",
    "deepseek",
    "kimi",
    "glm",
    "qwen",
    "minimax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "huggingface_hub>=0.24.0",
    "psutil>=5.9.0",
    "pynvml>=12.0.0",
    "ollama>=0.3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
dropprobe = "dropprobe.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/dropprobe"
Repository = "https://github.com/SuperMarioYL/dropprobe"
Issues = "https://github.com/SuperMarioYL/dropprobe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dropprobe"]

[tool.hatch.build.targets.wheel.force-include]
"src/dropprobe/data/config_db.yaml" = "dropprobe/data/config_db.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
